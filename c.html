<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>C-Mini IDE</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel-bg: #ffffff;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #94a3b8;
      --line-num-text: #94a3b8;
      --line-num-bg: #fdfdfd;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --err: #b91c1c;
      --info: #0284c7;
      --success: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation / Controls */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.2px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-tag {
      font-size: 11px;
      background: #f1f5f9;
      color: #475569;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .controls { display: flex; gap: 10px; }

    button {
      background: #ffffff;
      border: 1px solid var(--border-dark);
      color: var(--text-main);
      padding: 6px 16px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease-in-out;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    button:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    button.run-btn {
      background: var(--accent);
      color: #ffffff;
      border: 1px solid var(--accent);
    }

    button.run-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Main Workspace Layout */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 53px);
      background: #ffffff;
    }

    /* Left: Editor */
    .editor-pane {
      flex: 6;
      display: flex;
      position: relative;
      background: #ffffff;
      border-right: 1px solid var(--border);
    }

    .line-numbers {
      width: 48px;
      background: var(--line-num-bg);
      color: var(--line-num-text);
      padding: 14px 0;
      font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 22px;
      text-align: right;
      padding-right: 12px;
      user-select: none;
      border-right: 1px solid var(--border);
    }

    textarea {
      flex: 1;
      background: #ffffff;
      border: none;
      color: var(--text-main);
      padding: 14px 16px;
      font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 22px;
      resize: none;
      outline: none;
      white-space: pre;
      tab-size: 4;
      overflow: auto;
    }

    /* Right: Terminal / Output */
    .terminal-pane {
      flex: 4;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .terminal-header {
      background: #ffffff;
      padding: 9px 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    #output {
      flex: 1;
      padding: 14px 16px;
      font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 20px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: var(--text-main);
      background: #ffffff;
    }

    .stdout { color: var(--text-main); }
    .stderr { color: var(--err); font-weight: 500; }
    .stdinfo { color: var(--info); }
  </style>
</head>
<body>

  <header>
    <div class="title">
      <span>C Interpreter</span>
      <span class="title-tag">Built-in printf only</span>
    </div>
    <div class="controls">
      <button class="run-btn" onclick="runInterpreter()">Run Code</button>
      <button onclick="clearOutput()">Clear Output</button>
    </div>
  </header>

  <div class="workspace">
    <div class="editor-pane">
      <div id="lineNumbers" class="line-numbers">1</div>
      <textarea id="code" spellcheck="false" placeholder="Write code here..."></textarea>
    </div>
    <div class="terminal-pane">
      <div class="terminal-header">Console Output</div>
      <div id="output"></div>
    </div>
  </div>

  <script>
    const starterCode = 
`int main() {
    printf("Executing program...\\n");

    int total = 0;
    for (int i = 1; i <= 5; i++) {
        total = total + i;
        printf("Index %d -> Running total: %d\\n", i, total);
    }

    if (total == 15) {
        printf("\\nResult matches standard sum formula (n*(n+1)/2 = %d)\\n", total);
    }

    return 0;
}`;

    const codeEditor = document.getElementById('code');
    const lineNumbers = document.getElementById('lineNumbers');
    const outputEl = document.getElementById('output');

    codeEditor.value = starterCode;
    updateLineNumbers();

    codeEditor.addEventListener('input', updateLineNumbers);
    codeEditor.addEventListener('scroll', () => {
      lineNumbers.scrollTop = codeEditor.scrollTop;
    });

    codeEditor.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
        updateLineNumbers();
      }
    });

    function updateLineNumbers() {
      const lines = codeEditor.value.split('\n').length;
      lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
    }

    function printOut(msg, type = 'stdout') {
      const span = document.createElement('span');
      span.className = type;
      span.textContent = msg;
      outputEl.appendChild(span);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function clearOutput() { outputEl.innerHTML = ''; }

    // ==========================================
    //            INTERPRETER ENGINE
    // ==========================================

    function tokenize(src) {
      const tokens = [];
      let i = 0;
      let line = 1;

      while (i < src.length) {
        let ch = src[i];

        if (ch === '\n') { line++; i++; continue; }
        if (/\s/.test(ch)) { i++; continue; }

        if (ch === '/' && src[i + 1] === '/') {
          while (i < src.length && src[i] !== '\n') i++;
          continue;
        }

        if (ch === '/' && src[i + 1] === '*') {
          i += 2;
          while (i < src.length && !(src[i] === '*' && src[i + 1] === '/')) {
            if (src[i] === '\n') line++;
            i++;
          }
          i += 2;
          continue;
        }

        if (/[0-9]/.test(ch)) {
          let numStr = '';
          while (i < src.length && /[0-9.]/.test(src[i])) numStr += src[i++];
          tokens.push({ type: 'NUM', val: parseFloat(numStr), line });
          continue;
        }

        if (ch === '"') {
          let strVal = '';
          i++;
          while (i < src.length && src[i] !== '"') {
            if (src[i] === '\\') {
              i++;
              if (src[i] === 'n') strVal += '\n';
              else if (src[i] === 't') strVal += '\t';
              else if (src[i] === '"') strVal += '"';
              else if (src[i] === '\\') strVal += '\\';
              else strVal += src[i];
            } else {
              if (src[i] === '\n') line++;
              strVal += src[i];
            }
            i++;
          }
          i++;
          tokens.push({ type: 'STR', val: strVal, line });
          continue;
        }

        const twoChar = src.slice(i, i + 2);
        if (['==', '!=', '<=', '>=', '&&', '||', '++', '--'].includes(twoChar)) {
          tokens.push({ type: twoChar, val: twoChar, line });
          i += 2;
          continue;
        }

        if ('+-*/%<>=!;,(){}[]'.includes(ch)) {
          tokens.push({ type: ch, val: ch, line });
          i++;
          continue;
        }

        if (/[a-zA-Z_]/.test(ch)) {
          let id = '';
          while (i < src.length && /[a-zA-Z0-9_]/.test(src[i])) id += src[i++];
          tokens.push({ type: 'ID', val: id, line });
          continue;
        }

        throw new Error(`[Line ${line}] Unexpected character: '${ch}'`);
      }
      tokens.push({ type: 'EOF', line });
      return tokens;
    }

    class Parser {
      constructor(tokens) {
        this.tokens = tokens;
        this.pos = 0;
      }
      curr() { return this.tokens[this.pos]; }
      match(type) {
        if (this.curr().type === type) return this.tokens[this.pos++];
        return null;
      }
      expect(type) {
        const t = this.match(type);
        if (!t) throw new Error(`[Line ${this.curr().line}] Expected '${type}', found '${this.curr().val || this.curr().type}'`);
        return t;
      }

      parse() {
        const body = [];
        while (this.curr().type !== 'EOF') body.push(this.parseDeclarationOrFunction());
        return { type: 'Program', body };
      }

      parseDeclarationOrFunction() {
        const typeTok = this.curr();
        if (typeTok.type === 'ID' && ['int', 'void', 'char', 'float'].includes(typeTok.val)) {
          this.pos++;
          if (this.match('*')) {}
          const name = this.expect('ID').val;

          if (this.match('(')) {
            const params = [];
            while (this.curr().type !== ')') {
              this.expect('ID');
              if (this.match('*')) {}
              params.push(this.expect('ID').val);
              if (!this.match(',')) break;
            }
            this.expect(')');
            return { type: 'Function', name, params, body: this.parseBlock() };
          }

          let init = null;
          if (this.match('=')) init = this.parseExpr();
          this.expect(';');
          return { type: 'VarDecl', name, init };
        }
        return this.parseStmt();
      }

      parseBlock() {
        this.expect('{');
        const stmts = [];
        while (this.curr().type !== '}' && this.curr().type !== 'EOF') stmts.push(this.parseStmt());
        this.expect('}');
        return { type: 'Block', stmts };
      }

      parseStmt() {
        const t = this.curr();
        if (t.type === '{') return this.parseBlock();

        if (t.type === 'ID' && ['int', 'void', 'char', 'float'].includes(t.val)) {
          this.pos++;
          if (this.match('*')) {}
          const name = this.expect('ID').val;
          let init = null;
          if (this.match('=')) init = this.parseExpr();
          this.expect(';');
          return { type: 'VarDecl', name, init };
        }

        if (t.type === 'ID' && t.val === 'printf') {
          this.pos++;
          this.expect('(');
          const args = [];
          if (this.curr().type !== ')') {
            args.push(this.parseExpr());
            while (this.match(',')) args.push(this.parseExpr());
          }
          this.expect(')');
          this.expect(';');
          return { type: 'Printf', args };
        }

        if (t.type === 'ID' && t.val === 'if') {
          this.pos++;
          this.expect('(');
          const cond = this.parseExpr();
          this.expect(')');
          const thenBranch = this.parseStmt();
          let elseBranch = null;
          if (this.curr().type === 'ID' && this.curr().val === 'else') {
            this.pos++;
            elseBranch = this.parseStmt();
          }
          return { type: 'If', cond, thenBranch, elseBranch };
        }

        if (t.type === 'ID' && t.val === 'while') {
          this.pos++;
          this.expect('(');
          const cond = this.parseExpr();
          this.expect(')');
          return { type: 'While', cond, body: this.parseStmt() };
        }

        if (t.type === 'ID' && t.val === 'for') {
          this.pos++;
          this.expect('(');
          let init = null;
          if (this.curr().type !== ';') {
            if (this.curr().type === 'ID' && ['int', 'float'].includes(this.curr().val)) {
              this.pos++;
              const name = this.expect('ID').val;
              this.expect('=');
              init = { type: 'VarDecl', name, init: this.parseExpr() };
            } else {
              init = this.parseExpr();
            }
          }
          this.expect(';');
          const cond = this.curr().type !== ';' ? this.parseExpr() : { type: 'NUM', val: 1 };
          this.expect(';');
          const step = this.curr().type !== ')' ? this.parseExpr() : null;
          this.expect(')');
          return { type: 'For', init, cond, step, body: this.parseStmt() };
        }

        if (t.type === 'ID' && t.val === 'return') {
          this.pos++;
          let val = this.curr().type !== ';' ? this.parseExpr() : null;
          this.expect(';');
          return { type: 'Return', val };
        }

        const expr = this.parseExpr();
        this.expect(';');
        return { type: 'ExprStmt', expr };
      }

      parseExpr() { return this.parseAssign(); }

      parseAssign() {
        let left = this.parseLogicalOr();
        if (this.match('=')) return { type: 'Assign', target: left, val: this.parseAssign() };
        return left;
      }

      parseLogicalOr() {
        let left = this.parseLogicalAnd();
        while (this.match('||')) left = { type: 'Binary', op: '||', left, right: this.parseLogicalAnd() };
        return left;
      }

      parseLogicalAnd() {
        let left = this.parseEquality();
        while (this.match('&&')) left = { type: 'Binary', op: '&&', left, right: this.parseEquality() };
        return left;
      }

      parseEquality() {
        let left = this.parseRelational(), op;
        while ((op = this.match('==') || this.match('!='))) left = { type: 'Binary', op: op.type, left, right: this.parseRelational() };
        return left;
      }

      parseRelational() {
        let left = this.parseAdditive(), op;
        while ((op = this.match('<') || this.match('>') || this.match('<=') || this.match('>='))) left = { type: 'Binary', op: op.type, left, right: this.parseAdditive() };
        return left;
      }

      parseAdditive() {
        let left = this.parseMultiplicative(), op;
        while ((op = this.match('+') || this.match('-'))) left = { type: 'Binary', op: op.type, left, right: this.parseMultiplicative() };
        return left;
      }

      parseMultiplicative() {
        let left = this.parseUnary(), op;
        while ((op = this.match('*') || this.match('/') || this.match('%'))) left = { type: 'Binary', op: op.type, left, right: this.parseUnary() };
        return left;
      }

      parseUnary() {
        if (this.match('!')) return { type: 'Unary', op: '!', right: this.parseUnary() };
        if (this.match('-')) return { type: 'Unary', op: '-', right: this.parseUnary() };
        return this.parsePostfix();
      }

      parsePostfix() {
        let expr = this.parsePrimary();
        if (this.match('++')) return { type: 'Postfix', op: '++', target: expr };
        if (this.match('--')) return { type: 'Postfix', op: '--', target: expr };
        return expr;
      }

      parsePrimary() {
        const t = this.curr();
        if (this.match('(')) {
          const expr = this.parseExpr();
          this.expect(')');
          return expr;
        }
        if (t.type === 'NUM') { this.pos++; return { type: 'NUM', val: t.val }; }
        if (t.type === 'STR') { this.pos++; return { type: 'STR', val: t.val }; }
        if (t.type === 'ID') { this.pos++; return { type: 'Variable', name: t.val }; }
        throw new Error(`[Line ${t.line}] Unexpected token: '${t.val || t.type}'`);
      }
    }

    class Env {
      constructor(parent = null) {
        this.vars = Object.create(null);
        this.parent = parent;
      }
      set(name, val) {
        if (name in this.vars) { this.vars[name] = val; return; }
        if (this.parent) { this.parent.set(name, val); return; }
        this.vars[name] = val;
      }
      declare(name, val) { this.vars[name] = val; }
      get(name) {
        if (name in this.vars) return this.vars[name];
        if (this.parent) return this.parent.get(name);
        throw new Error(`Undefined variable '${name}'`);
      }
    }

    class ReturnSignal {
      constructor(val) { this.val = val; }
    }

    class Interpreter {
      constructor() {
        this.globalEnv = new Env();
        this.stepCounter = 0;
        this.MAX_STEPS = 500000;
      }

      eval(node, env) {
        if (++this.stepCounter > this.MAX_STEPS) throw new Error("Execution limit exceeded (possible infinite loop)");

        switch (node.type) {
          case 'Program': {
            let mainFunc = null;
            for (let stmt of node.body) {
              if (stmt.type === 'Function' && stmt.name === 'main') mainFunc = stmt;
              else if (stmt.type !== 'Function') this.eval(stmt, this.globalEnv);
            }
            if (mainFunc) {
              const res = this.eval(mainFunc.body, new Env(this.globalEnv));
              return res instanceof ReturnSignal ? res.val : 0;
            }
            return 0;
          }
          case 'Block': {
            const blockEnv = new Env(env);
            for (let s of node.stmts) {
              const res = this.eval(s, blockEnv);
              if (res instanceof ReturnSignal) return res;
            }
            return;
          }
          case 'VarDecl': {
            const val = node.init ? this.eval(node.init, env) : 0;
            env.declare(node.name, val);
            return;
          }
          case 'Assign': {
            if (node.target.type !== 'Variable') throw new Error("Invalid assignment target");
            const val = this.eval(node.val, env);
            env.set(node.target.name, val);
            return val;
          }
          case 'Postfix': {
            if (node.target.type !== 'Variable') throw new Error("Invalid increment/decrement target");
            const oldVal = env.get(node.target.name);
            env.set(node.target.name, oldVal + (node.op === '++' ? 1 : -1));
            return oldVal;
          }
          case 'If': {
            if (this.eval(node.cond, env)) return this.eval(node.thenBranch, env);
            else if (node.elseBranch) return this.eval(node.elseBranch, env);
            return;
          }
          case 'While': {
            while (this.eval(node.cond, env)) {
              const res = this.eval(node.body, env);
              if (res instanceof ReturnSignal) return res;
            }
            return;
          }
          case 'For': {
            const forEnv = new Env(env);
            if (node.init) this.eval(node.init, forEnv);
            while (this.eval(node.cond, forEnv)) {
              const res = this.eval(node.body, forEnv);
              if (res instanceof ReturnSignal) return res;
              if (node.step) this.eval(node.step, forEnv);
            }
            return;
          }
          case 'Return': return new ReturnSignal(node.val ? this.eval(node.val, env) : 0);
          case 'Printf': {
            if (!node.args.length) return;
            const fmt = String(this.eval(node.args[0], env));
            let argIdx = 1;
            const formatted = fmt.replace(/%[dsfci]/g, (spec) => {
              if (argIdx >= node.args.length) return spec;
              const val = this.eval(node.args[argIdx++], env);
              if (spec === '%d' || spec === '%i') return parseInt(val, 10);
              if (spec === '%f') return parseFloat(val);
              return val;
            });
            printOut(formatted, 'stdout');
            return;
          }
          case 'ExprStmt': return this.eval(node.expr, env);
          case 'Binary': {
            const l = this.eval(node.left, env);
            const r = this.eval(node.right, env);
            switch (node.op) {
              case '+': return l + r;
              case '-': return l - r;
              case '*': return l * r;
              case '/': return Math.floor(l / r);
              case '%': return l % r;
              case '<': return l < r ? 1 : 0;
              case '>': return l > r ? 1 : 0;
              case '<=': return l <= r ? 1 : 0;
              case '>=': return l >= r ? 1 : 0;
              case '==': return l == r ? 1 : 0;
              case '!=': return l != r ? 1 : 0;
              case '&&': return (l && r) ? 1 : 0;
              case '||': return (l || r) ? 1 : 0;
            }
            return 0;
          }
          case 'Unary': {
            const r = this.eval(node.right, env);
            return node.op === '!' ? (!r ? 1 : 0) : -r;
          }
          case 'Variable': return env.get(node.name);
          case 'NUM': return node.val;
          case 'STR': return node.val;
        }
      }
    }

    function runInterpreter() {
      clearOutput();
      printOut("[Starting execution...]\n", "stdinfo");
      const startTime = performance.now();

      try {
        const tokens = tokenize(codeEditor.value);
        const parser = new Parser(tokens);
        const ast = parser.parse();

        const interpreter = new Interpreter();
        const code = interpreter.eval(ast, interpreter.globalEnv);

        const duration = (performance.now() - startTime).toFixed(1);
        printOut(`\n[Finished with exit code ${code || 0} in ${duration}ms]\n`, "stdinfo");
      } catch (err) {
        printOut(`\nRuntime / Compilation Error: ${err.message}\n`, "stderr");
      }
    }
  </script>
</body>
</html>
